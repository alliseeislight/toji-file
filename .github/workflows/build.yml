name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - name: Build debug APK
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Toji File" com.neily.tojifile --web-dir www
          npx cap add android
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/Toji-File-${GITHUB_REF_NAME}-android.apk"
      - uses: actions/upload-artifact@v4
        with: {name: toji-file-apk, path: out/*.apk}

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Build AppImage
        working-directory: desktop
        run: |
          cp ../www/index.html index.html
          npm install
          npx electron-builder --linux AppImage --publish never
      - name: Name the AppImage
        run: |
          mkdir -p out
          cp desktop/dist/*.AppImage "out/Toji-File-${GITHUB_REF_NAME}-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with: {name: toji-file-linux, path: out/*.AppImage}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [apk, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: dist, merge-multiple: true}
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
